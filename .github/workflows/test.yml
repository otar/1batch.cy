# 1batch.cy: the site tests run for each push and each pull request.
# Set the check "test" as necessary for main (GitHub: Settings › Rules › Rulesets).
# Then a change goes to main, and to the live site, only after the tests pass.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The same Playwright version as in the Claude Code cloud sessions
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium

      - name: Check the syntax of app.js
        run: node --check site/app.js

      - name: Run the tests
        run: node --test tests/*.test.js
